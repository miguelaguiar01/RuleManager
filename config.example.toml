# ---------------------------------------------------------------------------
# EXAMPLE config for the data-audit engine. Placeholders only.
#
# Copy this to a file that lives OUTSIDE the repository (e.g.
#   ~/.rulemanager/audit.local.toml
# ) and fill in the real values there. Never commit a filled-in copy — the
# repo's .gitignore blocks *.local.toml, but keep real names off this machine's
# tracked tree regardless.
#
# Names support two placeholders that the engine substitutes:
#   {provider}  ->  e.g. the provider you pass on the CLI
#   {type}      ->  each of naming.attribute_types
# All rendered names must be lowercase Postgres identifiers ([a-z_][a-z0-9_]*).
# ---------------------------------------------------------------------------

# Provide the connection ONE of three ways (whichever you have):
#
# (A) Plain fields — easiest for a local/Docker Postgres. Translate a JDBC URL
#     jdbc:postgresql://HOST:PORT/DBNAME?user=USER&password=PW&sslmode=disable
#     field-by-field into the keys below (drop the "jdbc:" prefix; the ?query
#     params become their own keys):
[connection]
host = "REPLACE_ME_host"          # e.g. localhost when the container maps its port
port = 5432                       # the HOST-side mapped port from `docker ps`
dbname = "REPLACE_ME_db"
user = "REPLACE_ME_readonly_role"
# password = "REPLACE_ME"         # prefer ~/.pgpass (chmod 600); this file is
                                  # gitignored, but keep secrets out where you can
# sslmode = "disable"             # local Docker often needs this
statement_timeout_ms = 30000
#
# (B) A libpq DSN instead of the fields above:
# dsn = "postgresql://REPLACE_ME_readonly_role@REPLACE_ME_host:5432/REPLACE_ME_db"
#
# (C) A pg_service name from ~/.pg_service.conf:
# service = "REPLACE_ME_pg_service"
#
# No special database role is needed: the engine opens the session read-only
# and refuses to execute any statement that isn't a plain read.

[naming]
ca_table          = "REPLACE_ME_ca_{provider}"
attribute_table   = "REPLACE_ME_{type}_attrs_{provider}"
materialized_view = "REPLACE_ME_mv_{provider}"
attribute_types   = ["date", "int", "string", "decimal", "object"]

[columns]
ca_id          = "REPLACE_ME_{provider}_ca_id"
mnemonic       = "mnemonic"
swift_code     = "swift_code"
attribute_name = "attribute"
attribute_value = "value"

# --- Providers -------------------------------------------------------------
# Declare each provider once. Then just: `uv run audit.py --provider bb`.
# `rules` is the ruleset JSON you pass to RuleManager for that provider.
# If a provider's tables/columns don't follow the shared templates above, add
# a [providers.<name>.naming] and/or [providers.<name>.columns] table to
# override only the keys that differ.

[providers.bb]
rules = "REPLACE_ME/enrichment_calculation_rules_bb.json"

[providers.wm]
rules = "REPLACE_ME/enrichment_calculation_rules_wm.json"
# Example per-provider override (delete if not needed):
# [providers.wm.columns]
# ca_id = "wm_ca_id"
